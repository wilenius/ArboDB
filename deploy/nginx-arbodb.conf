# ArboDB — nginx server block.
#
# Serves the built SPA from disk and proxies the three Supabase APIs the app
# uses to Kong on the same host, so the browser talks to a single origin and
# there is no CORS to configure.
#
# Replace arb.hw.iki.fi with your hostname, then run certbot — it turns this
# into the TLS version itself. See DEPLOYING.md.

server {
    server_name arb.hw.iki.fi;

    root /srv/arbodb/www;
    index index.html;

    # Photo uploads go through /storage/. The app downscales in the browser
    # before sending, but imported map layers are whole georeferenced images.
    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Deliberately no font types here: woff2 is already compressed, and gzipping
    # it again just burns CPU for a percent.
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # --- Supabase API ------------------------------------------------------
    # Only these three. Kong serves Studio on the catch-all "/" route and pg-meta
    # on /pg/, so proxying more than this would publish the database dashboard
    # alongside the arboretum.
    location ~ ^/(rest|auth|storage)/ {
        # http:// on purpose, and it stays http:// after certbot runs. TLS
        # terminates here at nginx; this hop is loopback only, so the packets
        # never reach a network interface. X-Forwarded-Proto below is what tells
        # the upstream the original request was https.
        #
        # The port must match KONG_HTTP_PORT in stack/.env. Upstream defaults to
        # 8000; this uses 8100 because 8000 is busy on most real servers.
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # No websocket upgrade block: this app uses no realtime subscriptions.
        # Add one here if that ever changes, along with /realtime/ above.
    }

    # --- The app -----------------------------------------------------------
    # Filenames here are content-hashed, so a year is safe and a rebuild simply
    # produces different names.
    location /_app/immutable/ {
        # One directive, not `expires 1y` plus an add_header — those emit two
        # Cache-Control headers and a redundant Expires.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Not hashed: SvelteKit polls it to notice a new deploy. Cached, it would
    # never notice.
    location = /_app/version.json {
        add_header Cache-Control "no-cache";
    }

    # The shell must never be cached, or a deploy leaves clients holding an old
    # index.html that points at asset URLs which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Static adapter with a SPA fallback: unknown paths are client-side routes,
    # so they get the shell rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Port 80 on purpose: this is the pre-certbot state. Running
    #   sudo certbot --nginx -d arb.hw.iki.fi
    # rewrites this to `listen 443 ssl`, adds the ssl_certificate lines and the
    # options-ssl-nginx/dhparam includes, and appends a second server block that
    # redirects port 80 to https. Do not add those by hand — certbot owns them,
    # and nginx will not start while it references a certificate that does not
    # exist yet.
    listen 80;

    # If the hostname has an AAAA record, add the matching IPv6 listener —
    # certbot converts whatever listeners it finds. `listen 443 ssl` alone binds
    # IPv4 only, which fails on IPv6-only mobile networks.
    #   listen [::]:80;
}
